    sdk: flutter
  provider: ^6.1.2
  google_fonts: ^6.2.1
  material_design_icons_flutter: ^7.0.7296

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
